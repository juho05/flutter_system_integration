name: flutter_system_integration
description: "Version checking, auto updates and AppImage desktop integration for Flutter apps distributed via GitHub releases."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  android_package_installer: ^0.0.3
  cupertino_ui: ^1.1.1
  device_info_plus: ^13.1.0
  http: ^1.6.0
  logging: ^1.3.0
  material_ui: ^1.4.0
  open_file: ^4.0.0
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
